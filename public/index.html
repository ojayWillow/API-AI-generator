<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generate studio</title>
<style>
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #161616; --surface-2: #1f1f1f; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series: #3987e5; --series-track: #184f95; --accent: #3987e5;
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --good-text: #0ca30c; --star: #eda100;
    --side: 200px; --controls: 380px;
  }
  @media (prefers-color-scheme: light) {
    :root[data-theme="light"] {
      color-scheme: light;
      --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f1f1ee; --ink: #0b0b0b; --ink-2: #52514e;
      --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --series: #2a78d6; --series-track: #cde2fb; --accent: #2a78d6; --good-text: #006300;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  h3 { font-size: 11px; margin: 14px 0 6px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .muted { color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }

  /* shell */
  .app { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
  .side { background: var(--surface); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  .brand { font-weight: 700; font-size: 15px; padding: 6px 10px 14px; letter-spacing: .02em; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--ink-2); cursor: pointer; border: none; background: none; font: inherit; text-align: left; width: 100%; }
  .nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav.on { background: var(--surface-2); color: var(--ink); }
  .nav:hover { color: var(--ink); }
  .side .foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 10px; }
  .main { min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--page); z-index: 10; }
  .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 13px; background: var(--surface); }
  .pill b { font-weight: 600; }
  .pill a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .view { padding: 16px 20px 60px; }
  .banner { border-left: 3px solid var(--warning); background: var(--surface); padding: 10px 14px; margin-bottom: 14px; border-radius: 6px; }
  .banner code { background: var(--page); padding: 1px 5px; border-radius: 4px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 50; display: none; max-width: 90vw; }

  /* create layout */
  .create { display: grid; grid-template-columns: var(--controls) 1fr; gap: 16px; align-items: start; }
  .controls { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--page); }
  .seg.full { display: flex; }
  .seg button { background: none; border: none; padding: 7px 12px; color: var(--ink-2); cursor: pointer; font: inherit; flex: 1; }
  .seg button.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .seg.mode button.on { background: var(--accent); color: #fff; }
  label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=search], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--page); color: var(--ink); font: inherit;
  }
  textarea { resize: vertical; }
  textarea.prompt { min-height: 120px; font-size: 14px; padding: 12px; line-height: 1.5; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .row.one { grid-template-columns: 1fr; }
  .row.three { grid-template-columns: 1fr 1fr 1fr; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); border-radius: 20px; padding: 5px 11px; font-size: 12px; color: var(--ink-2); background: var(--page); cursor: pointer; }
  .chip.on { border-color: var(--accent); color: var(--ink); background: var(--surface-2); }
  .drop { border: 1px dashed var(--border); border-radius: 10px; padding: 10px; display: flex; gap: 10px; align-items: center; min-height: 72px; background: var(--page); }
  .drop img { width: 44px; height: 60px; object-fit: cover; border-radius: 4px; background: var(--surface-2); }
  .drop .grow { flex: 1; min-width: 0; }
  .refs { display: flex; flex-wrap: wrap; gap: 8px; }
  .ref { position: relative; width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: var(--surface-2); }
  .ref img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ref.on { border-color: var(--accent); }
  .ref.add { display: flex; align-items: center; justify-content: center; border: 1px dashed var(--border); color: var(--ink-2); font-size: 20px; }
  details { border-top: 1px solid var(--grid); margin-top: 12px; padding-top: 8px; }
  summary { cursor: pointer; font-size: 12px; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 6px; }
  summary::before { content: "▸"; font-size: 11px; }
  details[open] summary::before { content: "▾"; }
  details .inner { padding-top: 10px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
  .linkbtn { background: none; border: none; color: var(--ink-2); text-decoration: underline; cursor: pointer; font: inherit; font-size: 12px; padding: 0; }
  .footer { position: sticky; bottom: -14px; background: var(--surface); padding: 12px 0 2px; margin-top: 12px; border-top: 1px solid var(--grid); }
  .cost { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; gap: 8px; }
  .cost b { color: var(--ink); font-size: 14px; }
  button.primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 11px 14px; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost, a.ghost { background: none; border: 1px solid var(--border); color: var(--ink); border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.ghost.on { border-color: var(--accent); color: var(--accent); }
  .msg { font-size: 12px; color: var(--ink-2); margin-top: 6px; min-height: 16px; }

  /* feed */
  .feed { display: grid; gap: 14px; }
  .feed-head { display: flex; justify-content: space-between; align-items: center; color: var(--ink-2); font-size: 13px; }
  .gen { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .gen .top { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; font-size: 12px; color: var(--ink-2); border-bottom: 1px solid var(--grid); }
  .gen .top .p { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gen .items { display: grid; gap: 10px; padding: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .gen.running .items { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .skel { aspect-ratio: 9 / 14; border-radius: 8px; background: linear-gradient(100deg, var(--surface-2) 30%, var(--grid) 50%, var(--surface-2) 70%); background-size: 200% 100%; animation: sh 1.6s infinite; display: flex; align-items: flex-end; padding: 8px; font-size: 12px; color: var(--ink-2); }
  @keyframes sh { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  .item { background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .item.starred { border-color: var(--star); }
  .item.rejected { opacity: .5; }
  .item.cmp { outline: 2px solid var(--accent); }
  .item .media { background: var(--page); aspect-ratio: 9 / 14; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
  .item img, .item video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .item .body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .item .prompt { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .item .note { color: var(--ink-2); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .btns { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .item .btns button, .item .btns a { font-size: 11px; padding: 3px 7px; border-radius: 6px; }
  .item .btns button.star.on { border-color: var(--star); color: var(--star); }
  .item .btns button.rej.on { border-color: var(--critical); color: var(--critical); }
  .badge { position: absolute; top: 6px; left: 6px; font-size: 11px; background: rgba(0,0,0,.6); color: #fff; padding: 2px 6px; border-radius: 4px; }
  .state { position: absolute; top: 6px; right: 6px; font-size: 11px; background: rgba(0,0,0,.6); color: #fff; padding: 2px 6px; border-radius: 4px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; }

  /* library */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input[type=search] { width: 240px; }
  .board { display: grid; gap: 14px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }

  /* spend */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .tile .label { color: var(--ink-2); font-size: 13px; }
  .tile .value { font-size: 28px; font-weight: 600; margin: 4px 0 2px; }
  .tile.hero .value { font-size: 44px; line-height: 1.1; }
  .tile .note { color: var(--muted); font-size: 12px; }
  .meter { height: 8px; border-radius: 4px; background: var(--series-track); overflow: hidden; margin: 8px 0 6px; }
  .meter > div { height: 100%; background: var(--series); border-radius: 4px; }
  .meter.warn > div { background: var(--warning); }
  .meter.over > div { background: var(--critical); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .status.warn::before { background: var(--warning); }
  .status.over::before { background: var(--critical); }
  .chart-wrap { position: relative; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  svg .lbl { fill: var(--ink-2); font-weight: 600; }
  svg .grid { stroke: var(--grid); stroke-width: 1; }
  svg .base { stroke: var(--axis); stroke-width: 1; }
  svg .bar { fill: var(--series); pointer-events: none; }
  svg .hit { fill: transparent; }
  svg .hit:hover { fill: var(--grid); opacity: .5; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.3); display: none; z-index: 5; }
  .tip b { display: block; color: var(--ink); }
  .tip span { color: var(--ink-2); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 40; padding: 20px; }
  .modal.on { display: flex; }
  .modal .box { background: var(--surface); border-radius: 12px; padding: 14px; max-width: 1200px; width: 100%; max-height: 95vh; overflow: auto; }
  .modal .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal .pair.single { grid-template-columns: 1fr; }
  .modal .pair img, .modal .pair video { width: 100%; max-height: 72vh; object-fit: contain; background: var(--page); border-radius: 8px; }
  .modal .cap { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  .modal .close { float: right; }

  @media (max-width: 1000px) { .create { grid-template-columns: 1fr; } .controls { position: static; max-height: none; } }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; flex-direction: row; justify-content: space-around; padding: 6px; border-right: none; border-top: 1px solid var(--border); z-index: 20; }
    .brand, .side .foot { display: none; }
    .nav { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 10px; width: auto; }
    .view { padding: 12px 12px 90px; }
    .topbar { padding: 10px 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Generate</div>
    <button class="nav on" data-view="create"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg>Create</button>
    <button class="nav" data-view="library"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Library</button>
    <button class="nav" data-view="spend"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 16V9M11 16V5M16 16v-6"/></svg>Spend</button>
    <div class="foot" id="dir"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="viewTitle">Create</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="pill" id="creditsPill">…</span>
        <span class="sub" id="updated"></span>
      </div>
    </div>

    <div class="view" id="view-create">
      <div id="banner" class="banner hidden"></div>
      <div class="create">
        <form class="controls" id="form" autocomplete="off">
          <div class="seg mode full"><button type="button" id="kindImage" class="on">Image</button><button type="button" id="kindVideo">Video</button></div>

          <h3>Model</h3>
          <select id="imgModel"><option value="nano-banana-2">Nano Banana 2 · fast, references</option><option value="gpt-image-2">GPT Image 2 · readable text</option></select>
          <select id="vidModel" class="hidden"><option value="2.5">Seedance 2.5 · draft at 480p, final at 1080p</option></select>

          <div id="imageOptions">
            <h3>References <span class="muted" id="refHint"></span></h3>
            <div class="refs" id="refs"></div>
            <input type="file" id="refFile" accept="image/*" multiple class="hidden">
          </div>
          <div id="videoOptions" class="hidden">
            <h3>Source still</h3>
            <div class="drop" id="source"></div>
            <input type="text" id="still" placeholder="…or paste an image URL" style="margin-top:8px">
          </div>

          <h3>Prompt</h3>
          <select id="preset" style="margin-bottom:8px"><option value="">No preset</option></select>
          <textarea id="prompt" class="prompt"></textarea>
          <div class="muted" id="presetFrag" style="margin-top:4px"></div>

          <div id="imageSettings">
            <h3>Aspect ratio</h3>
            <div class="chips" id="aspectChips"></div>
            <h3>Resolution</h3>
            <div class="chips" id="resChips"></div>
            <h3>Variations</h3>
            <div class="chips" id="countChips"></div>
          </div>
          <div id="videoSettings" class="hidden">
            <div id="vresWrap"><h3>Quality</h3><div class="chips" id="vresChips"></div><div class="muted" id="vresNote" style="margin-top:4px"></div></div>
            <h3>Duration</h3>
            <div class="chips" id="durChips"></div>
            <div id="vcountWrap"><h3>Drafts to make</h3><div class="chips" id="vcountChips"></div></div>
            <div class="row" style="margin-top:10px">
              <div><label class="check"><input type="checkbox" id="audio" checked> Generate audio</label></div>
              <div><label class="check"><input type="checkbox" id="cameraFixed"> Camera fixed</label></div>
            </div>
            <input type="hidden" id="seed" value="-1">
          </div>

          <details id="helper"><summary>Prompt helper</summary><div class="inner">
            <div id="imageBuilder">
              <div class="row"><div><label for="f_subject">Subject</label><input type="text" id="f_subject" placeholder="a Roman senator waking up"></div><div><label for="f_setting">Setting</label><input type="text" id="f_setting" placeholder="marble villa bedroom at dawn"></div></div>
              <div class="row"><div><label for="f_camera">Camera and lens</label><input type="text" id="f_camera" placeholder="35mm, eye level"></div><div><label for="f_light">Lighting</label><input type="text" id="f_light" placeholder="warm sunlight"></div></div>
              <div class="row"><div><label for="f_mood">Mood and style</label><input type="text" id="f_mood" placeholder="cinematic, photoreal"></div><div><label for="f_details">Details</label><input type="text" id="f_details" placeholder="silk sheets, a toga on a chair"></div></div>
            </div>
            <div id="videoBuilder" class="hidden">
              <div class="row"><div><label for="m_camera">Camera move</label><input type="text" id="m_camera" placeholder="slow push-in"></div><div><label for="m_subject">Subject motion</label><input type="text" id="m_subject" placeholder="head turns to the window"></div></div>
              <div class="row"><div><label for="m_atmo">Atmosphere</label><input type="text" id="m_atmo" placeholder="curtains move, dust in the light"></div><div><label for="m_keep">Keep still</label><input type="text" id="m_keep" placeholder="face stays in frame"></div></div>
            </div>
            <div class="muted">Fields write into the prompt. <button type="button" class="linkbtn" id="rebuild">Rebuild from fields</button></div>
          </div></details>

          <details id="advanced"><summary>Advanced</summary><div class="inner">
            <div class="row one"><div><label for="negative">Avoid (negative prompt)</label><input type="text" id="negative" placeholder="text, watermark, logo"></div></div>
            <div class="row"><div><label for="imgName">File name</label><input type="text" id="imgName" placeholder="optional"></div><div><label for="vidName">Clip name</label><input type="text" id="vidName" placeholder="optional"></div></div>
            <label class="check"><input type="checkbox" id="overrideCap"> Override spend cap for this run</label>
          </div></details>

          <div class="footer">
            <div class="cost"><span id="costLabel">Estimated cost</span><b id="cost">–</b></div>
            <label class="check hidden" id="approveWrap" style="margin-bottom:8px"><input type="checkbox" id="approve"> I approve this paid run</label>
            <button type="submit" class="primary" id="goBtn">Generate</button>
            <div class="msg" id="formMsg"></div>
            <div style="margin-top:6px"><button type="button" class="linkbtn" id="clearBtn">Clear form</button></div>
          </div>
        </form>

        <div class="feed" id="feed"></div>
      </div>
    </div>

    <div class="view hidden" id="view-library">
      <div class="toolbar">
        <div class="seg" id="kindFilter"><button type="button" data-f="all" class="on">All</button><button type="button" data-f="image">Images</button><button type="button" data-f="video">Videos</button></div>
        <button type="button" class="ghost" id="starFilter">★ Starred</button>
        <button type="button" class="ghost" id="showRejected">Show rejected</button>
        <input type="search" id="search" placeholder="Search prompts and notes">
        <button type="button" class="ghost hidden" id="compareBtn">Compare 2 selected</button>
        <span class="sub" id="boardCount"></span>
      </div>
      <div class="board" id="board"></div>
    </div>

    <div class="view hidden" id="view-spend">
      <div class="tiles" id="tiles"></div>
      <div class="card chart-wrap">
        <div class="chart-head"><h2>Spend this month, per day</h2><button class="linkbtn" id="tableToggle">Table view</button></div>
        <div id="chart"></div><div id="chartTable" class="hidden"></div><div class="tip" id="tip"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="box"><button class="ghost close" id="modalClose">Close</button><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fmtUsd = (v) => "$" + (Number(v) || 0).toFixed(2);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let state = null, presets = {}, kind = "image", manualPrompt = false, tableOpen = false;
  const settings = {aspect: "9:16", resolution: "1K", count: 1, duration: 10, vres: "480p"};
  let filter = {kind: "all", starred: false, rejected: false, q: ""};
  const jobs = new Map(), polling = new Set(), refSel = [], cmpSel = [];
  let source = null, parentId = null;

  async function api(path, body) {
    const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {cache: "no-store"});

  // ---------- state loop ----------
  async function load() {

    } catch (e) { $("updated").textContent = "API not reachable: " + e.message; }

  }
  async function pollJob(id) {
    if (polling.has(id)) return;

      const r = await api("/api/tasks?id=" + encodeURIComponent(id));
      if (r.ok && r.job) { jobs.set(id, r.job); renderFeed(); if (r.job.status !== "running") { setTimeout(load, 800); return; } }
      else if (r.gone) { jobs.delete(id); renderFeed(); setTimeout(load, 800); return; }
    } catch {} finally { polling.delete(id); }

  }

  }
  function renderBanner(s) {

  }
  function meter(used, cap) {
    const pct = cap > 0 ? Math.min(100, used / cap * 100) : 0, r = cap > 0 ? used / cap : 0;

    return `<div class="meter ${cls}"><div style="width:${pct.toFixed(1)}%"></div></div><span class="status ${cls}">${word}, ${pct.toFixed(0)}% of ${fmtUsd(cap)}</span>`;
  }

  }

  // ---------- chart ----------
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
  function renderChart(daily, spend) {
    const host = $("chart"); const W = host.clientWidth || 600, H = 220, padL = 44, padR = 12, padT = 18, padB = 26;
    const maxV = niceMax(Math.max(0, ...daily.map(d => d.usd)));
    const n = daily.length, band = (W - padL - padR) / n, bw = Math.min(24, band * 0.6);
    const y = v => padT + (H - padT - padB) * (1 - v / maxV), base = H - padB;
    const maxIdx = daily.reduce((m, d, i) => d.usd > daily[m].usd ? i : m, 0);
    let g = "", hits = "", bars = "";
    for (let t = 0; t <= 4; t++) { const v = maxV * t / 4, yy = y(v); g += `<line class="${t ? "grid" : "base"}" x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}"/><text x="${padL - 6}" y="${yy + 4}" text-anchor="end">${v >= 1 ? "$" + v.toFixed(v % 1 ? 2 : 0) : "$" + v.toFixed(2)}</text>`; }
    daily.forEach((d, i) => {
      const x = padL + band * i + (band - bw) / 2, top = y(d.usd), h = Math.max(0, base - top), r = Math.min(4, h);
      hits += `<rect class="hit" x="${padL + band * i}" y="${padT}" width="${band}" height="${H - padT - padB}" data-i="${i}"/>`;
      bars += `<path class="bar" d="${h > 0 ? `M${x},${base} V${top + r} q0,-${r} ${r},-${r} H${x + bw - r} q${r},0 ${r},${r} V${base} Z` : ""}"/>`;
      const day = +d.date.slice(8);
      if (n <= 16 || day === 1 || day % 5 === 0) bars += `<text x="${padL + band * i + band / 2}" y="${H - 8}" text-anchor="middle">${day}</text>`;
      if (i === maxIdx && d.usd > 0) bars += `<text class="lbl" x="${x + bw / 2}" y="${top - 5}" text-anchor="middle">${fmtUsd(d.usd)}</text>`;
    });
    host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spend this month">${g}${hits}${bars}</svg>`;
    const tip = $("tip");
    host.querySelectorAll(".hit").forEach(el => {
      el.addEventListener("mousemove", ev => { const d = daily[+el.dataset.i]; tip.innerHTML = `<b>${d.date}</b><span>${fmtUsd(d.usd)} · ${d.runs} run${d.runs === 1 ? "" : "s"}</span>`; tip.style.display = "block"; const rect = host.parentElement.getBoundingClientRect(); tip.style.left = Math.min(ev.clientX - rect.left + 12, rect.width - 150) + "px"; tip.style.top = (ev.clientY - rect.top - 10) + "px"; });
      el.addEventListener("mouseleave", () => tip.style.display = "none");
    });
    $("chartTable").innerHTML = `<table><thead><tr><th>Day</th><th class="num">Runs</th><th class="num">USD</th></tr></thead><tbody>` + daily.map(d => `<tr><td>${d.date}</td><td class="num">${d.runs}</td><td class="num">${fmtUsd(d.usd)}</td></tr>`).join("") + `<tr><td><b>Month</b></td><td class="num"><b>${spend.month_runs}</b></td><td class="num"><b>${fmtUsd(spend.month_usd)}</b></td></tr></tbody></table>`;
  }
  $("tableToggle").onclick = () => { tableOpen = !tableOpen; $("chart").classList.toggle("hidden", tableOpen); $("chartTable").classList.toggle("hidden", !tableOpen); $("tableToggle").textContent = tableOpen ? "Chart view" : "Table view"; };
  window.addEventListener("resize", () => state && !$("view-spend").classList.contains("hidden") && renderChart(state.daily, state.spend));

  // ---------- chips ----------
  function chips(id, values, key, labels) {
    $(id).innerHTML = values.map(v => `<button type="button" class="chip ${settings[key] == v ? "on" : ""}" data-v="${v}">${labels ? labels[v] : v}</button>`).join("");
    $(id).querySelectorAll(".chip").forEach(b => b.onclick = () => { settings[key] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; renderChips(); estimate(); });
  }
  function renderChips() {
    chips("aspectChips", ["9:16", "16:9", "1:1", "4:5", "auto"], "aspect", {"9:16": "9:16 vertical", "16:9": "16:9", "1:1": "1:1", "4:5": "4:5", "auto": "auto"});
    chips("resChips", ["1K", "2K", "4K"], "resolution");
    chips("countChips", [1, 2, 3, 4], "count", {1: "1", 2: "2", 3: "3", 4: "4"});
    const durs = [4, 5, 6, 8, 10, 12, 15];
    if (!durs.includes(settings.duration)) settings.duration = 10;
    chips("durChips", durs, "duration", Object.fromEntries(durs.map(d => [d, d + " s"])));
    const pr = state && state.pricing && state.pricing.video["2.5"], rate = pr ? pr.credits_per_second : {"480p": 28, "720p": 63, "1080p": 158};
    chips("vresChips", ["480p", "720p", "1080p"], "vres", {"480p": `Draft 480p · ${rate["480p"]} cr/s`, "720p": `720p · ${rate["720p"]} cr/s`, "1080p": `1080p direct · ${rate["1080p"]} cr/s`});
    const isDraft = settings.vres === "480p";

      ? `Drafts are cheap previews. Pick the one you like, press Finalize on it, and it is re-rendered at 1080p with the same motion for about ${fmtUsd(rate["1080p"] * 0.005)} per second. Draft ids stay valid 7 days.`
      : `Direct render at ${settings.vres}. No draft step, no cheap preview.`;
    $("vcountWrap").classList.toggle("hidden", !isDraft);
    if (!isDraft) settings.count = 1;
    chips("vcountChips", [1, 2, 3, 4], "count", {1: "1", 2: "2", 3: "3", 4: "4"});
  }
  $("vidModel").onchange = () => { renderChips(); estimate(); };
  $("imgModel").onchange = () => { renderRefs(); estimate(); };

  // ---------- cost estimate (client side, same table as the server) ----------
  function estimate() {
    if (!state) return;
    const pr = state.pricing || {}, per = state.usd_per_credit || 0.005;
    let credits = 0, label = "";
    if (kind === "image") { const m = pr.image && pr.image[$("imgModel").value]; credits = m ? (m.credits[settings.resolution] || 0) * settings.count : 0; label = `${settings.count} still${settings.count > 1 ? "s" : ""} · ${settings.resolution}`; }
    else {
      const m = pr.video && pr.video["2.5"];
      const rate = m ? (m.credits_per_second[settings.vres] || 0) : 0;
      const isDraft = settings.vres === "480p", n = isDraft ? settings.count : 1;
      credits = Math.round(rate * settings.duration) * n;
      label = isDraft ? `${n} draft${n > 1 ? "s" : ""} · ${settings.duration} s · 480p` : `${settings.duration} s · ${settings.vres}`;
    }
    const usd = credits * per, left = state.spend ? Math.min(state.spend.remaining_today_usd, state.spend.remaining_month_usd) : null;
    $("costLabel").textContent = label + (left != null ? ` · ${fmtUsd(left)} left under cap` : "");
    $("cost").textContent = `${fmtUsd(usd)} · ${credits} cr`;
    const isDraft = kind === "video" && settings.vres === "480p";
    $("goBtn").textContent = kind === "image" ? (settings.count > 1 ? `Generate ${settings.count} variations` : "Generate image")
      : isDraft ? (settings.count > 1 ? `Make ${settings.count} drafts` : "Make draft") : `Render ${settings.vres}`;
  }

  // ---------- presets and builder ----------
  async function loadPresets() {
    try { presets = await (await fetch("/presets.json", {cache: "no-store"})).json(); } catch { presets = {}; }
    $("preset").innerHTML = `<option value="">No preset</option>` + Object.entries(presets).map(([k, p]) => `<option value="${esc(k)}">${esc(p.label || k)}</option>`).join("");
  }
  function preset() { return presets[$("preset").value] || null; }
  function applyPreset() {
    const p = preset();
    $("presetFrag").textContent = p ? "Preset adds: " + (kind === "image" ? p.still : p.motion) : "";
    if (!p) { compose(); return; }
    if (p.aspect) settings.aspect = p.aspect;
    if (p.image_model) $("imgModel").value = p.image_model;
    if (p.duration) settings.duration = p.duration;
    $("cameraFixed").checked = !!p.camera_fixed;
    if (p.negative && !$("negative").value) $("negative").value = p.negative;
    renderChips(); manualPrompt = false; compose(); estimate();
  }
  $("preset").onchange = applyPreset;
  const join = (parts) => parts.map(s => (s || "").trim()).filter(Boolean).join(", ");
  function compose(force) {
    if (manualPrompt && !force) return;
    const p = preset();
    $("prompt").value = kind === "image"
      ? join([$("f_subject").value, $("f_setting").value, p && p.still, $("f_camera").value, $("f_light").value, $("f_mood").value, $("f_details").value])

  ["f_subject", "f_setting", "f_camera", "f_light", "f_mood", "f_details", "m_camera", "m_subject", "m_atmo", "m_keep"].forEach(id => $(id).addEventListener("input", () => compose()));
  $("prompt").addEventListener("input", () => { manualPrompt = true; });
  $("rebuild").onclick = () => { manualPrompt = false; compose(true); };
  function fields() {
    return kind === "image"
      ? {subject: $("f_subject").value, setting: $("f_setting").value, camera: $("f_camera").value, lighting: $("f_light").value, mood: $("f_mood").value, details: $("f_details").value}
      : {camera: $("m_camera").value, subject: $("m_subject").value, atmosphere: $("m_atmo").value, keep: $("m_keep").value};
  }
  function setFields(f) {
    const map = kind === "image" ? {subject: "f_subject", setting: "f_setting", camera: "f_camera", lighting: "f_light", mood: "f_mood", details: "f_details"} : {camera: "m_camera", subject: "m_subject", atmosphere: "m_atmo", keep: "m_keep"};
    Object.entries(map).forEach(([k, id]) => $(id).value = (f && f[k]) || "");
  }
  function setKind(k) {
    kind = k;
    $("kindImage").classList.toggle("on", k === "image"); $("kindVideo").classList.toggle("on", k === "video");
    ["imgModel", "imageOptions", "imageSettings", "imageBuilder"].forEach(id => $(id).classList.toggle("hidden", k !== "image"));
    ["vidModel", "videoOptions", "videoSettings", "videoBuilder", "approveWrap"].forEach(id => $(id).classList.toggle("hidden", k !== "video"));
    $("prompt").placeholder = k === "image"
      ? "Describe the shot. Example: a Roman senator waking up in a marble villa at dawn, first-person POV, warm light, no text"

    manualPrompt = false; applyPreset(); renderSource(); updateGo(); estimate();
  }
  function updateGo() { $("goBtn").disabled = kind === "video" && !$("approve").checked; }
  $("kindImage").onclick = () => setKind("image"); $("kindVideo").onclick = () => setKind("video");
  $("approve").onchange = updateGo;
  $("clearBtn").onclick = () => { $("form").reset(); refSel.length = 0; source = null; parentId = null; settings.count = 1; manualPrompt = false; renderChips(); applyPreset(); renderSource(); renderRefs(); $("formMsg").textContent = ""; updateGo(); estimate(); };

  // ---------- references ----------
  function renderRefs() {
    const host = $("refs"); if (!state) return;
    const lib = [...(state.refs || [])];
    const known = new Set(lib.map(r => refOf(r)));
    refSel.forEach(r => { if (!known.has(r.ref)) lib.unshift({name: r.name, url: r.url, path: r.path}); });
    host.innerHTML = lib.map(r => { const ref = refOf(r), on = refSel.some(s => s.ref === ref); return `<div class="ref ${on ? "on" : ""}" data-ref="${esc(ref)}" data-url="${esc(r.url)}" data-name="${esc(r.name)}" data-path="${esc(r.path || "")}" title="${esc(r.name)}"><img src="${esc(r.url)}" loading="lazy" alt=""></div>`; }).join("") + `<div class="ref add" id="refAdd" title="Upload reference images">+</div>`;
    host.querySelectorAll(".ref:not(.add)").forEach(el => el.onclick = () => toggleRef({ref: el.dataset.ref, url: el.dataset.url, name: el.dataset.name, path: el.dataset.path || null}));

  }
  function toggleRef(r) {
    const i = refSel.findIndex(s => s.ref === r.ref);
    if (i >= 0) refSel.splice(i, 1); else { if (refSel.length >= 3) { toast("Up to 3 reference images."); return; } refSel.push(r); if ($("imgModel").value !== "nano-banana-2") { $("imgModel").value = "nano-banana-2"; toast("Switched to Nano Banana 2, which accepts references."); } }

  }
  $("refFile").onchange = async (ev) => {
    for (const f of [...ev.target.files]) { try { const up = await uploadImage(f, f.name.replace(/\.[^.]+$/, ""), "ref"); state.refs.unshift({name: up.name, url: up.url, path: up.path}); toggleRef({ref: refOf(up), url: up.url, name: up.name, path: up.path || null}); toast(`Uploaded ${up.name}`); } catch (e) { toast("Upload failed: " + e.message, 4000); } }
    ev.target.value = "";
  };
  function fileToDataUrl(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
  async function downscale(dataUrl, max = 2048) {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);

  }

    const r = await api("/api/upload", {name, data: dataUrl, kind: kindOfUpload});
    if (!r.ok) throw new Error(r.error || "upload failed");
    return r;
  }
  async function uploadDataUrl(dataUrl, name, kindOfUpload) {
    if (dataUrl.length > 4.6 * 1024 * 1024) dataUrl = await downscale(dataUrl, 1920);
    const r = await api("/api/upload", {name, data: dataUrl, kind: kindOfUpload});
    if (!r.ok) throw new Error(r.error || "upload failed");
    return r;
  }

  // ---------- video source ----------

    host.innerHTML = `<img src="${esc(source.url)}" alt=""><div class="grow"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(source.name)}</div><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(source.prompt || "")}</div></div><button type="button" class="ghost" id="sourceClear">change</button>`;
    $("still").value = refOf(source);

  }
  $("still").addEventListener("input", () => { if (source) { source = null; renderSource(); } });

  // ---------- generate ----------
  function payload() {

    if (kind === "image") return {...base, model: $("imgModel").value, aspect: settings.aspect, resolution: settings.resolution, count: settings.count, name: $("imgName").value || null, refs: refSel.map(r => r.ref)};
    const isDraft = settings.vres === "480p";
    return {...base, image: $("still").value, model: "2.5", duration: settings.duration, resolution: settings.vres, draft: isDraft, count: isDraft ? settings.count : 1, audio: $("audio").checked, seed: $("seed").value, camera_fixed: $("cameraFixed").checked, name: $("vidName").value || null, approve: $("approve").checked};
  }
  async function submit(p) {
    const j = await api("/api/generate", p);

  $("form").onsubmit = async (ev) => {

    $("formMsg").textContent = "Submitting…"; $("goBtn").disabled = true;

  // ---------- cards ----------
  function card(g) {
    const media = g.kind === "video" ? `<video src="${esc(g.url)}" controls preload="metadata" muted></video>` : `<img src="${esc(g.url)}" loading="lazy" alt="${esc(g.prompt || g.name)}">`;
    const dims = g.media && g.media.width ? `${g.media.width}x${g.media.height}${g.media.duration_s ? " · " + g.media.duration_s + "s" : ""}` : "";
    const when = (g.created_at || g.modified || "").slice(5, 16).replace("T", " ");
    const res = g.params && g.params.resolution ? g.params.resolution : "";
    const isDraft = g.kind === "video" && g.params && g.params.draft;
    const isFinal = g.model === "2.5-final";
    const finalOf = isDraft ? state.generations.find(x => x.parent_id === g.id && x.model === "2.5-final") : null;
    const finalCost = isDraft ? fmtUsd(((state.pricing && state.pricing.video["2.5-final"] && state.pricing.video["2.5-final"].credits_per_second) || 158) * ((g.params && g.params.duration_s) || 0) * (state.usd_per_credit || 0.005)) : "";
    const daysLeft = isDraft && g.created_at ? Math.max(0, Math.ceil((new Date(g.created_at).getTime() + 7 * 864e5 - Date.now()) / 864e5)) : null;
    const follow = g.kind === "image"
      ? `<button class="ghost act" data-a="animate">Animate</button><button class="ghost act" data-a="tweak">Tweak</button><button class="ghost act" data-a="ref">Use as ref</button><button class="ghost act" data-a="reframe169">16:9</button><button class="ghost act" data-a="reframe11">1:1</button><button class="ghost act" data-a="hires">${res === "1K" || !res ? "2K" : "4K"}</button>`
      : `${isDraft && !finalOf && daysLeft > 0 ? `<button class="ghost act" data-a="finalize" style="border-color:var(--accent);color:var(--accent)">Finalize 1080p · ${finalCost}</button>` : ""}${finalOf ? `<button class="ghost act" data-a="showfinal">1080p ready</button>` : ""}<button class="ghost act" data-a="extend">Extend</button><button class="ghost act" data-a="redo">Redo</button>`;
    const stateBadge = isFinal ? `<span class="state">1080p final</span>` : isDraft ? `<span class="state">draft 480p${daysLeft != null ? ` · ${daysLeft}d` : ""}</span>` : "";
    return `<div class="item ${g.rating === "star" ? "starred" : ""} ${g.rating === "reject" ? "rejected" : ""} ${cmpSel.includes(g.id) ? "cmp" : ""}" data-id="${esc(g.id)}">
      ${g.variant ? `<span class="badge">v${g.variant}</span>` : ""}${stateBadge}
      <div class="media act" data-a="view">${media}</div>
      <div class="body">
        <div class="prompt" title="${esc(g.prompt || "")}">${esc(g.prompt || g.name)}</div>
        ${g.note ? `<div class="note" title="${esc(g.note)}">${esc(g.note)}</div>` : ""}
        <div class="meta"><span>${esc(g.model || g.kind)}${res ? " · " + res : ""}</span><span>${g.usd != null ? fmtUsd(g.usd) : ""}</span></div>
        <div class="meta"><span>${when}</span><span>${dims}</span></div>
        <div class="btns">
          <button class="ghost act star ${g.rating === "star" ? "on" : ""}" data-a="star" title="Star">★</button>
          <button class="ghost act rej ${g.rating === "reject" ? "on" : ""}" data-a="reject" title="Reject">✕</button>
          <button class="ghost act" data-a="note">Note</button>
          <button class="ghost act ${cmpSel.includes(g.id) ? "on" : ""}" data-a="cmp" title="Select for compare">Cmp</button>
          <a class="ghost" href="${esc(g.url)}" target="_blank" rel="noopener" download>↓</a>
        </div>
        <div class="btns">${follow}${g.path ? `<button class="ghost act" data-a="copy">Path</button>` : ""}</div>
      </div></div>`;
  }
  function attach(host) {
    host.querySelectorAll(".act").forEach(el => el.onclick = (ev) => { ev.preventDefault(); const id = el.closest(".item").dataset.id; action(el.dataset.a, state.generations.find(g => g.id === id)); });
  }
  function groupsOf(items) {
    const groups = new Map();
    items.forEach(g => { const k = g.group || "_" + g.id; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(g); });
    return groups;
  }
  function setHtml(k, gs, all) {
    const picked = all.find(x => x.rating === "star");
    return `<div class="gen"><div class="top"><span class="p">${esc(gs[0].prompt || "")}</span><span>${all.length} variations · ${picked ? "picked " + esc(picked.name) : "pick one"}</span></div><div class="items">${gs.map(g => card(g).replace('<div class="btns">', `<div class="btns"><button class="ghost act" data-a="pick">Pick</button>`)).join("")}</div></div>`;
  }

  // ---------- feed (create view) ----------
  function renderFeed() {
    const host = $("feed"); if (!state) return;
    let html = "";
    const running = [...jobs.values()].filter(j => j.status === "running").sort((a, b) => b.started_at - a.started_at);
    const failed = [...jobs.values()].filter(j => j.status !== "running" && j.status !== "done" && Date.now() / 1000 - (j.finished_at || j.started_at) < 600);
    if (running.length) {
      const byGroup = new Map(); running.forEach(j => { const k = j.group || j.id; if (!byGroup.has(k)) byGroup.set(k, []); byGroup.get(k).push(j); });
      byGroup.forEach(js => { html += `<div class="gen running"><div class="top"><span class="p">${esc(js[0].prompt || "")}</span><span>${esc(js[0].kind)} · ${esc(js[0].model || "default")}</span></div><div class="items">${js.map(j => `<div class="skel">${esc(j.kie_state || "running")} · ${Math.round(Date.now() / 1000 - j.started_at)}s</div>`).join("")}</div></div>`; });
    }
    failed.forEach(j => { const r = j.result || {}; const msg = j.status === "approval_required" ? `Needs approval: ${fmtUsd(r.usd_est)} for ${r.duration_s}s on ${r.model}. Tick "I approve this paid run" and generate again.` : (r.error || j.message || "failed"); html += `<div class="gen"><div class="top" style="border:none"><span class="p" style="color:var(--critical)">${esc(j.status.replace("_", " "))}: ${esc(j.prompt || "")}</span></div><div class="muted" style="padding:0 12px 12px">${esc(msg)}</div></div>`; });
    const items = state.generations.filter(g => !(g.rating === "reject" || g.hidden)).slice(0, 24);
    if (!items.length && !html) { host.innerHTML = `<div class="empty">Your generations will appear here. Write a prompt on the left and press Generate.</div>`; return; }
    html += `<div class="feed-head"><span>Recent</span><button class="ghost" id="toLibrary">Open library</button></div>`;
    groupsOf(items).forEach((gs, k) => {
      const all = state.generations.filter(x => x.group === k);
      if (!k.startsWith("_") && all.length > 1) html += setHtml(k, gs, all);
      else html += `<div class="gen"><div class="items">${gs.map(card).join("")}</div></div>`;
    });
    host.innerHTML = html; attach(host);
    const tl = $("toLibrary"); if (tl) tl.onclick = () => showView("library");
  }

  // ---------- library ----------
  function visible(g) {
    if (filter.kind !== "all" && g.kind !== filter.kind) return false;
    if (filter.starred && g.rating !== "star") return false;
    if (!filter.rejected && (g.rating === "reject" || g.hidden)) return false;
    if (filter.q) { const q = filter.q.toLowerCase(); if (!((g.prompt || "").toLowerCase().includes(q) || (g.note || "").toLowerCase().includes(q) || (g.name || "").toLowerCase().includes(q))) return false; }
    return true;
  }
  function renderBoard() {
    const host = $("board"); if (!state) return;
    const items = state.generations.filter(visible);
    $("boardCount").textContent = `${items.length} of ${state.generations.length}`;
    if (!items.length) { host.innerHTML = `<div class="empty">Nothing to show. Generate something or change the filters.</div>`; return; }
    let html = "", loose = [];
    const flush = () => { if (loose.length) { html += `<div class="gallery">${loose.map(card).join("")}</div>`; loose = []; } };
    groupsOf(items).forEach((gs, k) => {
      const all = state.generations.filter(x => x.group === k);
      if (k.startsWith("_") || all.length < 2) { loose.push(...gs); return; }
      flush(); html += setHtml(k, gs, all);
    });
    flush(); host.innerHTML = html; attach(host);
  }
  async function setItem(g, patch) {
    Object.assign(g, patch); renderFeed(); renderBoard();
    const r = await api("/api/item", {id: g.id, ...patch});
    if (!r.ok) toast("Could not save: " + (r.error || "unknown"), 4000);
  }
  async function action(a, g) {
    if (!g) return;
    const resOf = () => (g.params && g.params.resolution) || "1K";
    const toCreate = () => { showView("create"); $("form").scrollIntoView({behavior: "smooth", block: "start"}); };
    switch (a) {
      case "view": openModal([g]); break;
      case "star": await setItem(g, {rating: g.rating === "star" ? null : "star", hidden: false}); break;
      case "reject": await setItem(g, {rating: g.rating === "reject" ? null : "reject", hidden: g.rating !== "reject"}); break;
      case "note": { const n = prompt("Note for this item", g.note || ""); if (n !== null) await setItem(g, {note: n}); break; }
      case "cmp": { const i = cmpSel.indexOf(g.id); if (i >= 0) cmpSel.splice(i, 1); else { if (cmpSel.length >= 2) cmpSel.shift(); cmpSel.push(g.id); } $("compareBtn").classList.toggle("hidden", cmpSel.length !== 2); renderFeed(); renderBoard(); if (cmpSel.length === 2) toast("Two selected. Compare is in the Library toolbar.", 2000); break; }
      case "pick": { const sibs = state.generations.filter(x => x.group === g.group && x.id !== g.id); await setItem(g, {rating: "star", hidden: false}); for (const s of sibs) if (s.rating !== "star") await setItem(s, {rating: "reject", hidden: true}); toast("Picked. The others are rejected."); break; }
      case "copy": try { await navigator.clipboard.writeText(g.path); toast("Path copied"); } catch { prompt("Path", g.path); } break;
      case "showfinal": { const f = state.generations.find(x => x.parent_id === g.id && x.model === "2.5-final"); if (f) openModal([g, f]); break; }
      case "finalize": {
        const dur = (g.params && g.params.duration_s) || 0;
        const rate = (state.pricing && state.pricing.video["2.5-final"] && state.pricing.video["2.5-final"].credits_per_second) || 158;
        const usd = rate * dur * (state.usd_per_credit || 0.005);
        if (!confirm(`Render this draft at 1080p for about ${fmtUsd(usd)} (${rate * dur} credits)? It keeps the same motion. This is a paid run.`)) break;
        toast("Starting the 1080p render…");
        try {
          const j = await api("/api/finalize", {id: g.id, approve: true, override_cap: $("overrideCap").checked, prompt: g.prompt});
          if (j.ok && j.job) { jobs.set(j.job.id, j.job); pollJob(j.job.id); renderFeed(); showView("create"); }
          else toast(j.error || "could not start the render", 5000);
        } catch (e) { toast(e.message, 5000); }
        break; }
      case "animate": setKind("video"); source = g; parentId = g.id; renderSource(); toCreate(); $("prompt").focus(); break;
      case "tweak": setKind("image"); $("preset").value = g.preset || ""; applyPreset(); setFields(g.fields); if (!g.fields || !g.fields.subject) { manualPrompt = true; $("prompt").value = g.prompt || ""; } else { compose(true); $("helper").open = true; } $("negative").value = g.negative || ""; if (g.params) { if (g.params.aspect_ratio) settings.aspect = g.params.aspect_ratio; if (g.params.resolution) settings.resolution = g.params.resolution; } if (g.model) $("imgModel").value = g.model; refSel.length = 0; (g.refs || []).forEach(r => refSel.push({ref: r, url: r, name: r.split("/").pop()})); parentId = g.id; renderChips(); renderRefs(); estimate(); toCreate(); toast("Loaded. Edit and generate."); break;
      case "ref": toggleRef({ref: refOf(g), url: g.url, name: g.name, path: g.path || null}); setKind("image"); toCreate(); toast("Added as a reference."); break;
      case "reframe169": case "reframe11": {
        const aspect = a === "reframe169" ? "16:9" : "1:1"; toast(`Generating ${aspect} version…`);
        try { await submit({kind: "image", prompt: g.prompt, negative: g.negative || "", fields: g.fields || null, model: "nano-banana-2", aspect, resolution: resOf(), count: 1, name: (g.name || "").replace(/\.[^.]+$/, "") + "-" + aspect.replace(":", "x"), refs: [refOf(g)], parent_id: g.id, preset: g.preset || null}); showView("create"); } catch (e) { toast(e.message, 4000); }
        break; }
      case "hires": {
        const next = resOf() === "1K" ? "2K" : "4K"; toast(`Generating ${next} version…`);
        try { await submit({kind: "image", prompt: g.prompt, negative: g.negative || "", fields: g.fields || null, model: g.model === "gpt-image-2" ? "gpt-image-2" : "nano-banana-2", aspect: (g.params && g.params.aspect_ratio) || "9:16", resolution: next, count: 1, name: (g.name || "").replace(/\.[^.]+$/, "") + "-" + next, refs: g.model === "gpt-image-2" ? [] : [refOf(g)], parent_id: g.id, preset: g.preset || null}); showView("create"); } catch (e) { toast(e.message, 4000); }
        break; }
      case "redo": setKind("video"); source = state.generations.find(x => refOf(x) === g.input_image || x.url === g.input_image || x.path === g.input_image) || {name: "previous still", url: g.input_image, prompt: ""}; renderSource(); $("still").value = g.input_image || ""; setFields(g.fields); if (!g.fields) { manualPrompt = true; $("prompt").value = g.prompt || ""; } else compose(true); $("negative").value = g.negative || ""; settings.duration = (g.params && g.params.duration_s) || 10; settings.vres = (g.params && g.params.draft) ? "480p" : ((g.params && /p$/.test(g.params.resolution || "")) ? g.params.resolution : "480p"); $("audio").checked = !(g.params && g.params.generate_audio === false); $("seed").value = g.seed ?? -1; $("cameraFixed").checked = !!(g.params && g.params.camera_fixed); parentId = g.id; renderChips(); estimate(); toCreate(); toast("Loaded. Change the motion, approve, generate."); break;
      case "extend": {
        toast("Capturing the last frame…");
        try {
          const dataUrl = await lastFrame(g.url);
          const up = await uploadDataUrl(dataUrl, (g.name || "clip").replace(/\.[^.]+$/, "") + "-last", "still");
          setKind("video"); source = {name: up.name, url: up.url, path: up.path, prompt: g.prompt}; renderSource();
          setFields(g.fields); if (!g.fields) { manualPrompt = true; $("prompt").value = g.prompt || ""; } else compose(true);
          settings.vres = "480p"; settings.duration = (g.params && g.params.duration_s) || 10; parentId = g.id; renderChips(); estimate(); toCreate();
          toast("Last frame is the new source still. Approve and make a draft to continue the shot.");
        } catch (e) { toast("Could not capture the frame: " + e.message, 5000); }
        break; }
    }
  }
  function lastFrame(url) {
    return new Promise((res, rej) => {
      const v = document.createElement("video"); v.crossOrigin = "anonymous"; v.muted = true; v.preload = "auto"; v.src = url;
      v.onerror = () => rej(new Error("video could not be loaded"));
      v.onloadedmetadata = () => { v.currentTime = Math.max(0, v.duration - 0.05); };
      v.onseeked = () => { try { const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext("2d").drawImage(v, 0, 0); res(c.toDataURL("image/png")); } catch (e) { rej(new Error("frame is blocked by the video host (CORS)")); } };
    });
  }
  function openModal(items) {
    $("modalBody").innerHTML = `<div class="pair ${items.length === 1 ? "single" : ""}">` + items.map(g => `<div>${g.kind === "video" ? `<video src="${esc(g.url)}" controls autoplay muted loop></video>` : `<img src="${esc(g.url)}" alt="">`}<div class="cap"><b>${esc(g.name)}</b> · ${esc(g.model || "")} · ${g.usd != null ? fmtUsd(g.usd) : ""}${g.media && g.media.width ? ` · ${g.media.width}x${g.media.height}` : ""}<br>${esc(g.prompt || "")}${g.note ? `<br><i>${esc(g.note)}</i>` : ""}</div></div>`).join("") + `</div>`;
    $("modal").classList.add("on");
  }
  $("modalClose").onclick = () => $("modal").classList.remove("on");
  $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) $("modal").classList.remove("on"); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("modal").classList.remove("on"); });
  $("compareBtn").onclick = () => openModal(cmpSel.map(id => state.generations.find(g => g.id === id)).filter(Boolean));
  $("kindFilter").querySelectorAll("button").forEach(b => b.onclick = () => { filter.kind = b.dataset.f; $("kindFilter").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); renderBoard(); });
  $("starFilter").onclick = () => { filter.starred = !filter.starred; $("starFilter").classList.toggle("on", filter.starred); renderBoard(); };
  $("showRejected").onclick = () => { filter.rejected = !filter.rejected; $("showRejected").classList.toggle("on", filter.rejected); renderBoard(); };
  $("search").addEventListener("input", () => { filter.q = $("search").value.trim(); renderBoard(); });

  renderChips();
  loadPresets().then(() => { setKind("image"); let v = "create"; try { v = localStorage.getItem("view") || "create"; } catch {} showView(v); load(); });
})();
</script>
</body>
</html>
