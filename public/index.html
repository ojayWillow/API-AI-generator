<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generate dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series: #2a78d6;
    --series-track: #cde2fb;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --good-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --series: #3987e5; --series-track: #184f95; --good-text: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series: #3987e5; --series-track: #184f95; --good-text: #0ca30c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 20px 16px 48px;
  }
  main { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  a { color: inherit; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .grid { display: grid; gap: 12px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 12px; }
  .tile .label { color: var(--ink-2); font-size: 13px; }
  .tile .value { font-size: 28px; font-weight: 600; margin: 4px 0 2px; }
  .tile.hero .value { font-size: 48px; line-height: 1.1; }
  .tile .note { color: var(--muted); font-size: 12px; }
  .meter { height: 8px; border-radius: 4px; background: var(--series-track); overflow: hidden; margin: 8px 0 6px; }
  .meter > div { height: 100%; background: var(--series); border-radius: 4px; }
  .meter.warn > div { background: var(--warning); }
  .meter.over > div { background: var(--critical); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .status.warn::before { background: var(--warning); }
  .status.over::before { background: var(--critical); }
  .two { grid-template-columns: 3fr 2fr; margin-bottom: 12px; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }

  .banner { border-left: 3px solid var(--warning); padding: 10px 14px; margin-bottom: 12px; }
  .banner code { background: var(--page); padding: 1px 5px; border-radius: 4px; }

  .chart-wrap { position: relative; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  svg .lbl { fill: var(--ink-2); font-weight: 600; }
  svg .grid { stroke: var(--grid); stroke-width: 1; }
  svg .base { stroke: var(--axis); stroke-width: 1; }
  svg .bar { fill: var(--series); pointer-events: none; }
  svg .hit { fill: transparent; cursor: default; }
  svg .hit:hover { fill: var(--grid); opacity: .5; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); display: none; z-index: 5; }
  .tip b { display: block; color: var(--ink); }
  .tip span { color: var(--ink-2); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .linkbtn { background: none; border: none; color: var(--ink-2); text-decoration: underline; cursor: pointer; font: inherit; font-size: 12px; padding: 0; }

  form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  form .row.one { grid-template-columns: 1fr; }
  label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 3px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--page); color: var(--ink); font: inherit;
  }
  textarea { min-height: 72px; resize: vertical; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .seg button { background: none; border: none; padding: 6px 14px; color: var(--ink-2); cursor: pointer; font: inherit; }
  .seg button.on { background: var(--series); color: #fff; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  button.primary { background: var(--series); color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost, a.ghost { background: none; border: 1px solid var(--border); color: var(--ink); border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; text-decoration: none; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
  .quote { font-size: 13px; color: var(--ink-2); margin-top: 8px; min-height: 18px; }
  .quote b { color: var(--ink); }
  .hidden { display: none !important; }

  .jobs { display: grid; gap: 8px; }
  .job { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
  .pill.running { border-color: var(--series); color: var(--series); }
  .pill.done { border-color: var(--good); color: var(--good-text); }
  .pill.failed, .pill.cap_exceeded { border-color: var(--critical); color: var(--critical); }
  .pill.approval_required { border-color: var(--warning); }
  .job .msg { color: var(--ink-2); font-size: 12px; white-space: pre-wrap; word-break: break-word; }

  .gallery { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .item .media { background: var(--page); aspect-ratio: 9 / 12; display: flex; align-items: center; justify-content: center; }
  .item img, .item video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .item .body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .item .prompt { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .item .btns { display: flex; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
  .item .btns button, .item .btns a { font-size: 12px; padding: 4px 9px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .filters { display: flex; gap: 6px; margin-bottom: 10px; }
  .filters button { font-size: 12px; padding: 4px 10px; }
  .filters button.on { border-color: var(--series); color: var(--series); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Generate dashboard</h1>
      <div class="sub" id="dir"></div>
    </div>
    <div class="sub" id="updated"></div>
  </header>

  <div id="banner" class="card banner hidden"></div>

  <section class="grid tiles" id="tiles"></section>

  <section class="grid two">
    <div class="card chart-wrap">
      <div class="chart-head">
        <h2>Spend this month, per day</h2>
        <button class="linkbtn" id="tableToggle">Table view</button>
      </div>
      <div id="chart"></div>
      <div id="chartTable" class="hidden"></div>
      <div class="tip" id="tip"></div>
    </div>

    <div class="card">
      <h2>New generation</h2>
      <div class="seg">
        <button type="button" id="kindImage" class="on">Image</button>
        <button type="button" id="kindVideo">Video</button>
      </div>
      <form id="form" autocomplete="off">
        <div class="row one">
          <div><label for="prompt">Prompt</label><textarea id="prompt" placeholder="first-person POV ... no text, no watermark"></textarea></div>
        </div>

        <div id="imageFields">
          <div class="row">
            <div><label for="imgModel">Model</label>
              <select id="imgModel"><option value="nano-banana-2">nano-banana-2 (default)</option><option value="gpt-image-2">gpt-image-2 (readable text)</option></select></div>
            <div><label for="aspect">Aspect</label>
              <select id="aspect"><option>9:16</option><option>16:9</option><option>1:1</option><option>4:5</option><option>auto</option></select></div>
          </div>
          <div class="row">
            <div><label for="resolution">Resolution</label>
              <select id="resolution"><option>1K</option><option>2K</option><option>4K</option></select></div>
            <div><label for="imgName">File name (optional)</label><input type="text" id="imgName" placeholder="roman-senator"></div>
          </div>
          <div class="row one">
            <div><label for="refs">Reference image URLs, one per line (nano-banana-2 only)</label><textarea id="refs" style="min-height:44px"></textarea></div>
          </div>
        </div>

        <div id="videoFields" class="hidden">
          <div class="row one">
            <div><label for="still">Source still (click Animate on a gallery image, or paste a URL)</label><input type="text" id="still" list="stills" placeholder="roman-senator.png"><datalist id="stills"></datalist></div>
          </div>
          <div class="row">
            <div><label for="vidModel">Model</label>
              <select id="vidModel"><option value="pro">pro, Seedance 1.0 Pro (default)</option><option value="lite">lite, budget</option><option value="2.5">2.5, on request</option></select></div>
            <div><label for="duration">Duration (s)</label><input type="number" id="duration" value="10" min="2" max="15" step="1"></div>
          </div>
          <div class="row">
            <div><label for="vidName">File name (optional)</label><input type="text" id="vidName"></div>
            <div style="padding-top:18px"><label class="check"><input type="checkbox" id="cameraFixed"> Camera fixed</label></div>
          </div>
          <div class="row one">
            <label class="check"><input type="checkbox" id="approve"> I approve this paid run</label>
          </div>
        </div>

        <div class="row one">
          <div><label for="preset">Preset name (optional, recorded with the output)</label><input type="text" id="preset" placeholder="pov"></div>
        </div>
        <label class="check"><input type="checkbox" id="overrideCap"> Override spend cap for this run</label>

        <div class="quote" id="quote"></div>
        <div class="actions">
          <button type="button" class="ghost" id="quoteBtn">Quote</button>
          <button type="submit" class="primary" id="goBtn">Generate image</button>
          <span class="sub" id="formMsg"></span>
        </div>
      </form>
    </div>
  </section>

  <section class="card" id="jobsCard" style="margin-bottom:12px">
    <h2>Jobs</h2>
    <div class="jobs" id="jobs"><div class="empty">Nothing running.</div></div>
  </section>

  <section>
    <div class="chart-head" style="margin-bottom:8px">
      <h2 style="margin:0">Generations</h2>
      <div class="filters">
        <button class="ghost on" data-f="all">All</button>
        <button class="ghost" data-f="image">Images</button>
        <button class="ghost" data-f="video">Videos</button>
      </div>
    </div>
    <div class="grid gallery" id="gallery"></div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fmtUsd = (v) => "$" + (Number(v) || 0).toFixed(2);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let state = null, kind = "image", filter = "all", tableOpen = false;
  const jobs = new Map();           // id -> job (merged from state + polls)
  const polling = new Set();

  async function api(path, body) {
    const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {cache: "no-store"});
    return r.json();
  }

  // ---------- state loop ----------
  async function load() {
    try {
      state = await api("/api/state");
      if (!state.ok) throw new Error(state.error || "state failed");
      (state.jobs || []).forEach(j => jobs.set(j.id, {...(jobs.get(j.id) || {}), ...j}));
      render();
    } catch (e) {
      $("updated").textContent = "Dashboard API not reachable: " + e.message;
    }
    jobs.forEach(j => { if (j.status === "running") pollJob(j.id); });
    setTimeout(load, 20000);
  }

  async function pollJob(id) {
    if (polling.has(id)) return;
    polling.add(id);
    try {
      const r = await api("/api/tasks?id=" + encodeURIComponent(id));
      if (r.ok && r.job) {
        jobs.set(id, r.job);
        renderJobs();
        if (r.job.status !== "running") { setTimeout(load, 800); return; }
      } else if (r.gone) {
        jobs.delete(id); renderJobs(); setTimeout(load, 800); return;
      }
    } catch {}
    finally { polling.delete(id); }
    const j = jobs.get(id);
    if (j && j.status === "running") setTimeout(() => pollJob(id), state && state.mode === "vercel" ? 12000 : 4000);
  }

  function render() {
    const s = state;
    $("dir").textContent = s.mode === "vercel" ? "Outputs stored in Vercel Blob" : s.generations_dir;
    $("updated").textContent = "Updated " + new Date(s.now).toLocaleTimeString();
    renderBanner(s); renderTiles(s); renderChart(s.daily, s.spend); renderJobs(); renderGallery(s.generations);
    $("stills").innerHTML = s.generations.filter(g => g.kind === "image").map(g => `<option value="${esc(g.path ? g.name : g.url)}">${esc(g.name)}</option>`).join("");
  }

  function renderBanner(s) {
    const b = $("banner");
    if (s.key_present && !s.setup_error) { b.classList.add("hidden"); return; }
    b.classList.remove("hidden");
    if (!s.key_present) {
      b.innerHTML = s.mode === "vercel"
        ? `<b>No API key.</b> Add <code>KIE_API_KEY</code> in the Vercel project's Environment Variables (Settings), then redeploy. The gallery still shows past runs.`
        : `<b>No API key.</b> Copy <code>.env.example</code> to <code>.env</code> in the skill folder, paste your kie.ai key into <code>KIE_API_KEY=</code>, then restart the dashboard.`;
    } else {
      b.innerHTML = `<b>Setup problem.</b> ${esc(s.setup_error)}`;
    }
  }

  function meterClass(used, cap) {
    if (cap <= 0) return "";
    const r = used / cap;
    return r >= 1 ? "over" : r >= 0.8 ? "warn" : "";
  }
  function meter(used, cap) {
    const pct = cap > 0 ? Math.min(100, used / cap * 100) : 0;
    const cls = meterClass(used, cap);
    const word = cls === "over" ? "Over cap" : cls === "warn" ? "Near cap" : "Within cap";
    return `<div class="meter ${cls}"><div style="width:${pct.toFixed(1)}%"></div></div>
            <span class="status ${cls}">${word}, ${pct.toFixed(0)}% of ${fmtUsd(cap)}</span>`;
  }

  function renderTiles(s) {
    const c = s.credits || {}, sp = s.spend;
    let creditVal, creditNote;
    if (c.value != null) { creditVal = Number(c.value).toLocaleString(); creditNote = `about ${fmtUsd(c.usd)} remaining on kie.ai`; }
    else { creditVal = "–"; creditNote = c.error || "checking…"; }
    $("tiles").innerHTML = `
      <div class="card tile hero"><div class="label">Credits remaining</div><div class="value">${creditVal}</div>
        <div class="note">${esc(creditNote)} <button class="linkbtn" id="refreshCredits">refresh</button></div></div>
      <div class="card tile"><div class="label">Spent today</div><div class="value">${fmtUsd(sp.today_usd)}</div>${meter(sp.today_usd, sp.session_cap_usd)}</div>
      <div class="card tile"><div class="label">Spent this month</div><div class="value">${fmtUsd(sp.month_usd)}</div>${meter(sp.month_usd, sp.monthly_cap_usd)}</div>
      <div class="card tile"><div class="label">Runs this month</div><div class="value">${sp.month_runs}</div>
        <div class="note">${sp.today_runs} today · ${s.generations.length} outputs kept</div></div>`;
    $("refreshCredits").onclick = async () => { await api("/api/refresh-credits", {}); setTimeout(load, 1200); };
  }

  // ---------- chart (single series, daily columns) ----------
  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
    return 10 * p;
  }
  function renderChart(daily, spend) {
    const host = $("chart"); const W = host.clientWidth || 600, H = 220;
    const padL = 44, padR = 12, padT = 18, padB = 26;
    const maxV = niceMax(Math.max(...daily.map(d => d.usd), 0.01));
    const n = daily.length, band = (W - padL - padR) / n, bw = Math.min(24, band * 0.6);
    const y = v => padT + (H - padT - padB) * (1 - v / maxV);
    const base = H - padB;
    const maxIdx = daily.reduce((m, d, i) => d.usd > daily[m].usd ? i : m, 0);
    let g = "";
    for (let t = 0; t <= 4; t++) {
      const v = maxV * t / 4, yy = y(v);
      g += `<line class="${t ? "grid" : "base"}" x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}"/>`;
      g += `<text x="${padL - 6}" y="${yy + 4}" text-anchor="end">${v >= 1 ? "$" + v.toFixed(v % 1 ? 1 : 0) : v.toFixed(2)}</text>`;
    }
    let hits = "", bars = "";
    daily.forEach((d, i) => {
      const x = padL + band * i + (band - bw) / 2, top = y(d.usd), h = Math.max(0, base - top);
      const r = Math.min(4, h);
      const path = h > 0 ? `M${x},${base} V${top + r} q0,-${r} ${r},-${r} H${x + bw - r} q${r},0 ${r},${r} V${base} Z` : "";
      hits += `<rect class="hit" x="${padL + band * i}" y="${padT}" width="${band}" height="${H - padT - padB}" data-i="${i}"/>`;
      bars += `<path class="bar" d="${path}"/>`;
      const day = +d.date.slice(8);
      if (n <= 16 || day === 1 || day % 5 === 0) bars += `<text x="${padL + band * i + band / 2}" y="${H - 8}" text-anchor="middle">${day}</text>`;
      if (i === maxIdx && d.usd > 0) bars += `<text class="lbl" x="${x + bw / 2}" y="${top - 5}" text-anchor="middle">${fmtUsd(d.usd)}</text>`;
    });
    host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spend this month">${g}${hits}${bars}</svg>`;
    const tip = $("tip");
    host.querySelectorAll(".hit").forEach(el => {
      el.addEventListener("mousemove", ev => {
        const d = daily[+el.dataset.i];
        tip.innerHTML = `<b>${d.date}</b><span>${fmtUsd(d.usd)} · ${d.runs} run${d.runs === 1 ? "" : "s"}</span>`;
        tip.style.display = "block";
        const rect = host.parentElement.getBoundingClientRect();
        tip.style.left = Math.min(ev.clientX - rect.left + 12, rect.width - 150) + "px";
        tip.style.top = (ev.clientY - rect.top - 10) + "px";
      });
      el.addEventListener("mouseleave", () => tip.style.display = "none");
    });
    $("chartTable").innerHTML = `<table><thead><tr><th>Day</th><th class="num">Runs</th><th class="num">USD</th></tr></thead><tbody>` +
      daily.map(d => `<tr><td>${d.date}</td><td class="num">${d.runs}</td><td class="num">${fmtUsd(d.usd)}</td></tr>`).join("") +
      `<tr><td><b>Month</b></td><td class="num"><b>${spend.month_runs}</b></td><td class="num"><b>${fmtUsd(spend.month_usd)}</b></td></tr></tbody></table>`;
  }
  $("tableToggle").onclick = () => {
    tableOpen = !tableOpen;
    $("chart").classList.toggle("hidden", tableOpen); $("chartTable").classList.toggle("hidden", !tableOpen);
    $("tableToggle").textContent = tableOpen ? "Chart view" : "Table view";
  };
  window.addEventListener("resize", () => state && renderChart(state.daily, state.spend));

  // ---------- jobs ----------
  function renderJobs() {
    const host = $("jobs");
    const list = [...jobs.values()].sort((a, b) => b.started_at - a.started_at).slice(0, 30);
    if (!list.length) { host.innerHTML = `<div class="empty">Nothing running.</div>`; return; }
    host.innerHTML = list.map(j => {
      const r = j.result || {};
      let msg = "";
      if (j.status === "running") msg = `${j.kie_state || "running"} · ${Math.round((Date.now() / 1000) - j.started_at)}s`;
      else if (j.status === "done") msg = `${esc(r.file || r.url)} · ${r.credits_consumed ?? "?"} credits · ${fmtUsd(r.usd)}` + (r.media && r.media.width ? ` · ${r.media.width}x${r.media.height}${r.media.duration_s ? " · " + r.media.duration_s + "s" : ""}` : "");
      else if (j.status === "approval_required") msg = `Needs approval: ${fmtUsd(r.usd_est)} for ${r.duration_s}s on ${r.model}. Tick "I approve this paid run" and generate again.`;
      else msg = esc(r.error || j.message || "failed");
      return `<div class="job"><span class="pill ${j.status}">${j.status.replace("_", " ")}</span>
        <div><div>${esc(j.kind)} · ${esc(j.model || "default")} · ${esc((j.prompt || "").slice(0, 90))}${(j.prompt || "").length > 90 ? "…" : ""}</div><div class="msg">${msg}</div></div>
        <span class="sub">${new Date(j.started_at * 1000).toLocaleTimeString()}</span></div>`;
    }).join("");
  }

  // ---------- gallery ----------
  function renderGallery(items) {
    const host = $("gallery");
    const list = items.filter(g => filter === "all" || g.kind === filter);
    if (!list.length) { host.innerHTML = `<div class="empty card" style="grid-column:1/-1">No generations yet. Make your first still with the form above.</div>`; return; }
    host.innerHTML = list.map(g => {
      const media = g.kind === "video"
        ? `<video src="${esc(g.url)}" controls preload="metadata" muted></video>`
        : `<img src="${esc(g.url)}" loading="lazy" alt="${esc(g.prompt || g.name)}">`;
      const dims = g.media && g.media.width ? `${g.media.width}x${g.media.height}${g.media.duration_s ? " · " + g.media.duration_s + "s" : ""}` : "";
      const when = (g.created_at || g.modified || "").slice(0, 16).replace("T", " ");
      const cost = g.usd != null ? fmtUsd(g.usd) : "";
      return `<div class="item" data-ref="${esc(g.path ? g.name : g.url)}">
        <div class="media">${media}</div>
        <div class="body">
          <div class="prompt" title="${esc(g.prompt || "")}">${esc(g.prompt || g.name)}</div>
          <div class="meta"><span>${esc(g.model || g.kind)}</span><span>${cost}</span></div>
          <div class="meta"><span>${when}</span><span>${dims}</span></div>
          <div class="btns">
            ${g.kind === "image" ? `<button class="ghost animate">Animate</button>` : ""}
            ${g.path ? `<button class="ghost copy" data-path="${esc(g.path)}">Copy path</button>` : ""}
            <a class="ghost" href="${esc(g.url)}" target="_blank" rel="noopener">Open</a>
          </div>
        </div></div>`;
    }).join("");
    host.querySelectorAll(".animate").forEach(b => b.onclick = () => {
      setKind("video"); $("still").value = b.closest(".item").dataset.ref;
      $("quote").textContent = ""; $("form").scrollIntoView({behavior: "smooth", block: "start"}); $("prompt").focus();
    });
    host.querySelectorAll(".copy").forEach(b => b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.path); b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy path", 1200); } catch { prompt("Path", b.dataset.path); }
    });
  }
  document.querySelectorAll(".filters button").forEach(b => b.onclick = () => {
    filter = b.dataset.f; document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("on", x === b));
    state && renderGallery(state.generations);
  });

  // ---------- form ----------
  function setKind(k) {
    kind = k;
    $("kindImage").classList.toggle("on", k === "image"); $("kindVideo").classList.toggle("on", k === "video");
    $("imageFields").classList.toggle("hidden", k !== "image"); $("videoFields").classList.toggle("hidden", k !== "video");
    $("goBtn").textContent = k === "image" ? "Generate image" : "Generate video";
    $("quote").textContent = ""; updateGo();
  }
  function updateGo() { $("goBtn").disabled = kind === "video" && !$("approve").checked; }
  $("kindImage").onclick = () => setKind("image"); $("kindVideo").onclick = () => setKind("video");
  $("approve").onchange = updateGo;

  function payload() {
    const base = {kind, prompt: $("prompt").value, preset: $("preset").value || null, override_cap: $("overrideCap").checked};
    if (kind === "image") return {...base, model: $("imgModel").value, aspect: $("aspect").value, resolution: $("resolution").value,
      name: $("imgName").value || null, refs: $("refs").value.split("\n").map(s => s.trim()).filter(Boolean)};
    return {...base, image: $("still").value, model: $("vidModel").value, duration: $("duration").value,
      camera_fixed: $("cameraFixed").checked, name: $("vidName").value || null, approve: $("approve").checked};
  }
  $("quoteBtn").onclick = async () => {
    const q = await api("/api/quote", payload());
    if (!q.ok) { $("quote").textContent = q.error || "quote failed"; return; }
    const extra = kind === "video" ? `${q.duration_s}s on ${q.model}` : `${q.resolution} on ${q.model}`;
    $("quote").innerHTML = `Estimated <b>${fmtUsd(q.usd_est)}</b> (${q.credits_est} credits) for ${esc(extra)}. Remaining today ${fmtUsd(q.spend.remaining_today_usd)}, this month ${fmtUsd(q.spend.remaining_month_usd)}.${q.note ? " " + esc(q.note) : ""}`;
  };
  $("form").onsubmit = async (ev) => {
    ev.preventDefault();
    const p = payload();
    if (!p.prompt.trim()) { $("formMsg").textContent = "Prompt is required."; return; }
    if (kind === "video" && !p.image.trim()) { $("formMsg").textContent = "Pick a source still."; return; }
    $("formMsg").textContent = "Submitting…"; $("goBtn").disabled = true;
    try {
      const j = await api("/api/generate", p);
      if (j.ok && j.job) {
        $("formMsg").textContent = "Job started.";
        jobs.set(j.job.id, j.job); renderJobs(); pollJob(j.job.id);
        $("approve").checked = false;
        $("jobsCard").scrollIntoView({behavior: "smooth", block: "nearest"});
      } else {
        $("formMsg").textContent = j.error || "failed";
        if (j.quote) $("quote").innerHTML = `Estimated <b>${fmtUsd(j.quote.usd_est)}</b> (${j.quote.credits_est} credits).`;
      }
    } catch (e) { $("formMsg").textContent = "Request failed: " + e.message; }
    updateGo();
  };

  setKind("image");
  load();
})();
</script>
</body>
</html>
